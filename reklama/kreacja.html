<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kreacja reklamy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0d1828; }
  html.portrait, html.portrait body { height: 1350px; }
  .ad {
    position: relative;
    width: 1080px;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: "Inter", system-ui, sans-serif;
    color: #fff;
    background: #14243a;
    overflow: hidden;
  }
  .photo {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 32%;
    display: block;
  }
  .photo::after {
    content: "";
    position: absolute;
    inset: 55% 0 0 0;
    background: linear-gradient(180deg, rgba(20, 36, 58, 0) 0%, rgba(20, 36, 58, .85) 92%, #14243a 100%);
  }
  .badge {
    position: absolute;
    top: 44px;
    left: 44px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 26px 14px 22px;
    border-radius: 999px;
    background: #d13b2a;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .3);
  }
  .badge i { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .sticker {
    position: absolute;
    top: 36px;
    right: 40px;
    z-index: 1;
    display: grid;
    place-content: center;
    justify-items: center;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fbe6b0 0%, #e2b964 48%, #c08a2c 100%);
    color: #14243a;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.02;
    text-align: center;
    transform: rotate(-9deg);
    box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55), inset 0 0 0 6px rgba(255, 255, 255, .35);
  }
  .sticker small {
    font-family: "Inter", sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .panel {
    position: relative;
    flex: none;
    padding: 6px 56px 50px;
  }
  .kicker {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #ecd08f;
  }
  .title {
    margin-top: 8px;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 84px;
    line-height: 1.02;
    letter-spacing: -.02em;
  }
  .title span { color: #ecd08f; }
  .row {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    font-size: 32px;
    font-weight: 600;
    color: rgba(255, 255, 255, .82);
  }
  .arrow {
    flex: none;
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f0d48f 0%, #d6a64a 100%);
    color: #14243a;
  }
  .portrait .title { font-size: 96px; }
  .portrait .title span { display: block; font-size: 120px; line-height: .98; }
  .portrait .panel { padding-bottom: 64px; }
</style>
</head>
<body>
  <div class="ad">
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1758686253692-2d6921de12dd?auto=format&fit=crop&crop=faces&w=1600&h=1400&q=85" alt="">
      <span class="badge"><i></i>Nowe kwoty 2026</span>
      <span class="sticker"><small>do</small>6938,92&nbsp;zł<small>miesięcznie</small></span>
    </div>
    <div class="panel">
      <p class="kicker">Rocznik 1951 i starsi</p>
      <p class="title"><span>+366,68 zł</span> co miesiąc z ZUS</p>
      <div class="row">
        <span>Kwoty dla każdego rocznika</span>
        <span class="arrow"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('f') === 'portrait') {
      document.documentElement.classList.add('portrait');
    }
  </script>
</body>
</html>
